name: Build Debug APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK 36 packages and accept licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(command -v sdkmanager || echo "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          echo "Using sdkmanager at: $SDKMANAGER"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "cmdline-tools;latest" "platform-tools" "build-tools;36.0.0" "platforms;android-36"
          if "$SDKMANAGER" --sdk_root="$SDK_ROOT" --list | grep -q "platforms;android-36.1"; then
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36.1"
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          set -o pipefail

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            tr -d '\r\n[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
          fi
          if ! keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
            rm -f debug.keystore
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK output
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Debug APK not found at $APK_PATH"
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: septis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Debug APK to Latest GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "$APK_PATH" --clobber
            gh release edit latest \
              --draft=false \
              --prerelease=false \
              --latest \
              --notes "Automated debug APK build (${GITHUB_SHA::7})."
          else
            gh release create latest "$APK_PATH" \
              --target "${{ github.sha }}" \
              --title "SEPTIS Debug APK" \
              --notes "Automated debug APK build (${GITHUB_SHA::7})." \
              --latest
          fi
